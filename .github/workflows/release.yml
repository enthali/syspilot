# Validates the current v2 release surface and publishes an authorized tag.
# Manual runs are validation-only and never publish Pages or a GitHub Release.

name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install documentation dependencies
        run: |
          uv venv .venv
          uv pip install --python .venv -r docs/requirements.txt

      - name: Run documentation build tests
        run: uv run python docs/test_docs_build.py -v

      - name: Validate tag and extract release notes
        if: github.event_name == 'push'
        id: release
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          match = re.fullmatch(
              r"v(?:0|[1-9]\d*)\."
              r"(?:0|[1-9]\d*)\."
              r"(?:0|[1-9]\d*)",
              tag,
          )
          if match is None:
              raise SystemExit(f"Invalid release tag: {tag}")

          lines = Path("docs/releasenotes.md").read_text(encoding="utf-8").splitlines()
          heading = re.compile(rf"^## {re.escape(tag)}(?:\s+-\s+.+)?$")
          starts = [index for index, line in enumerate(lines) if heading.fullmatch(line)]
          if len(starts) != 1:
              raise SystemExit(
                  f"Expected exactly one release-note heading for {tag}, found {len(starts)}"
              )

          start = starts[0]
          end = next(
              (index for index in range(start + 1, len(lines)) if lines[index].startswith("## ")),
              len(lines),
          )
          Path("release-notes-current.md").write_text(
              "\n".join(lines[start:end]).rstrip() + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload release notes
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes-current.md
          retention-days: 7
  
  build-docs:
    name: Build documentation
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install documentation dependencies
        run: |
          uv venv .venv
          uv pip install --python .venv -r docs/requirements.txt

      - name: Build documentation strictly
        run: uv run python docs/docs-build.py clean

      - name: Run release QA suites
        run: uv run python -m unittest discover -s tests -v

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/_build/html
          retention-days: 7
  
  publish-docs:
    name: Publish documentation
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: build-docs
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download documentation artifact
        uses: actions/download-artifact@v4
        with:
          name: documentation
          path: docs-html
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-html

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

  create-release:
    name: Create GitHub Release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [validate, publish-docs]
    permissions:
      contents: write

    steps:
      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes-current.md

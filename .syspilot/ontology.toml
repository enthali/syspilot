[syspilot]
schema_version = "2.0"
description = "syspilot v2 ontology — sphinx-needs reads [needs] directly; [syspilot.*] sections are syspilot-specific metadata."

# ---------------------------------------------------------------------------
# sphinx-needs configuration (read directly by sphinx-needs via needs_from_toml)
# ---------------------------------------------------------------------------

[needs]

# Require explicit IDs on every need directive
id_required = true

# Build needs.json and per-ID JSON files for tooling (ubCode, impact scripts)
build_json = true
build_json_per_id = true

# Use Graphviz for needflow diagrams
flow_engine = "graphviz"

# Extra option fields available on all need directives.
# "realized_by" holds a plain path reference (not a need link) to the file
# that IS the HOW — an agent file, skill file, or code location. There is no
# separate SPEC type in v2: a written HOW would duplicate the file verbatim.
extra_options = ["priority", "rationale", "realized_by"]

# ---------------------------------------------------------------------------
# Need Types
# ---------------------------------------------------------------------------

# The single graph root. Exactly one instance per project. Every User Story
# self-declares membership via :tracked_by:, so impact analysis and orphan
# detection can start from one deterministic node instead of a "type == story"
# convention.
[[needs.types]]
directive = "root"
title = "Graph Root"
prefix = "ROOT_"
color = "#4A4A4A"
style = "node"

[[needs.types]]
directive = "story"
title = "User Story"
prefix = "US_"
color = "#E8D5B7"
style = "node"

[[needs.types]]
directive = "req"
title = "Requirement"
prefix = "REQ_"
color = "#BFD8D2"
style = "node"

# Validation — did we build the right thing. User-facing, human-judged.
# One per Given/When/Then, linked to the User Story it validates.
[[needs.types]]
directive = "ac"
title = "Acceptance Criterion"
prefix = "AC_"
color = "#A8E6CF"
style = "node"

# Verification — did we build it right. Testable, linked to the Requirement
# it verifies.
[[needs.types]]
directive = "vc"
title = "Verification Criterion"
prefix = "VC_"
color = "#FFD3B6"
style = "node"

# A user-facing documentation surface maintained independently by the
# Technical Writer. The Need remains in the specification graph while
# "realized_by" points to documentation that contains no Needs markup.
[[needs.types]]
directive = "doc"
title = "User Documentation"
prefix = "DOC_"
color = "#C9C2E8"
style = "node"

# ---------------------------------------------------------------------------
# Statuses
# ---------------------------------------------------------------------------

[[needs.statuses]]
name = "draft"
description = "Draft - Work in progress"

[[needs.statuses]]
name = "open"
description = "Open - Identified but not yet started"

[[needs.statuses]]
name = "approved"
description = "Approved - Ready for implementation"

[[needs.statuses]]
name = "implemented"
description = "Implemented - Code exists"

[[needs.statuses]]
name = "verified"
description = "Verified - Tested and validated"

[[needs.statuses]]
name = "deprecated"
description = "Deprecated - No longer used"

# ---------------------------------------------------------------------------
# Extra Link Types
# ---------------------------------------------------------------------------

# US -> root. Self-declared entry-point membership (see [[syspilot.type_links]]).
[[needs.extra_links]]
option = "tracked_by"
incoming = "tracks"
outgoing = "tracked_by"

# REQ -> US. A requirement implements the user story's WHY.
[[needs.extra_links]]
option = "implements"
incoming = "is implemented by"
outgoing = "implements"

# REQ -> REQ. A concrete requirement applies a more general one.
# Direction is always concrete -> general; never sideways between two
# unrelated concrete requirements.
[[needs.extra_links]]
option = "specializes"
incoming = "is specialized by"
outgoing = "specializes"

# AC -> US. Validates that the user story's intent is satisfied.
[[needs.extra_links]]
option = "validates"
incoming = "is validated by"
outgoing = "validates"

# VC -> REQ. Verifies that the requirement is correctly implemented.
[[needs.extra_links]]
option = "verifies"
incoming = "is verified by"
outgoing = "verifies"

# DOC -> REQ. Declares which requirements a user-facing documentation surface
# contains in user-oriented form; the incoming relation exposes impact from REQ.
[[needs.extra_links]]
option = "includes"
incoming = "included_in"
outgoing = "includes"

# ===========================================================================
# syspilot-specific sections (ignored by sphinx-needs, read by agents/tooling)
# ===========================================================================
#
# NOTE: no [syspilot.actors] ownership table in v2. Per AD-6, artifact
# ownership is declared per process/checklist (see docs/Syspilot Processes/),
# not centrally in the ontology. A type can legitimately have different
# owners in different processes (e.g. a REQ owned by the Architect in one
# process, by the PM in an emergency-patch process).

# ---------------------------------------------------------------------------
# Type Link Relationships — directed, bottom-up relationships between types
# ---------------------------------------------------------------------------

[[syspilot.type_links]]
from = "story"
to   = "root"
rel  = "tracked_by"

[[syspilot.type_links]]
from = "req"
to   = "story"
rel  = "implements"

[[syspilot.type_links]]
from = "req"
to   = "req"
rel  = "specializes"

[[syspilot.type_links]]
from = "ac"
to   = "story"
rel  = "validates"

[[syspilot.type_links]]
from = "vc"
to   = "req"
rel  = "verifies"

[[syspilot.type_links]]
from = "doc"
to   = "req"
rel  = "includes"

# ---------------------------------------------------------------------------
# Status Transitions — lifecycle state machine
# ---------------------------------------------------------------------------

[syspilot.status_transitions]
# Universal transitions (apply to all types unless overridden)
universal = [
  { from = "draft",       to = "approved" },
  { from = "draft",       to = "open" },
  { from = "open",        to = "draft" },
  { from = "open",        to = "approved" },
  { from = "approved",    to = "implemented" },
  { from = "implemented", to = "verified" },
  { from = "approved",    to = "draft" },
]

# deprecated is a universal exit — reachable from any status
universal_exit = ["deprecated"]

# Type-specific overrides (replace universal for that type)
[syspilot.status_transitions.overrides.story]
transitions = [
  { from = "draft",    to = "approved" },
  { from = "approved", to = "verified" },
  { from = "approved", to = "draft" },
]

# The root is a stable anchor, not a work item in progress.
[syspilot.status_transitions.overrides.root]
transitions = [
  { from = "draft", to = "approved" },
]

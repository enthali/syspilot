[syspilot]
schema_version = "1.0"
description = "syspilot ontology definition — sphinx-needs reads [needs] directly; [syspilot.*] sections reserved for Phase 2+"

# ---------------------------------------------------------------------------
# sphinx-needs configuration (read directly by sphinx-needs via needs_from_toml)
# ---------------------------------------------------------------------------

[needs]

# Require explicit IDs on every need directive
id_required = true

# Build needs.json and per-ID JSON files for tooling (ubCode, impact scripts)
build_json = true
build_json_per_id = true

# Use Graphviz for needflow diagrams
flow_engine = "graphviz"

# Extra option fields available on all need directives
extra_options = ["priority", "rationale", "acceptance_criteria"]

# ---------------------------------------------------------------------------
# Need Types
# ---------------------------------------------------------------------------

[[needs.types]]
directive = "story"
title = "User Story"
prefix = "US_"
color = "#E8D5B7"
style = "node"

[[needs.types]]
directive = "req"
title = "Requirement"
prefix = "REQ_"
color = "#BFD8D2"
style = "node"

[[needs.types]]
directive = "spec"
title = "Design Specification"
prefix = "SPEC_"
color = "#FEDCD2"
style = "node"

[[needs.types]]
directive = "def"
title = "DEFINITION"
prefix = "DEF_"
color = "#C8A4D4"
style = "node"

[[needs.types]]
directive = "impl"
title = "Implementation"
prefix = "IMPL_"
color = "#DF744A"
style = "node"

[[needs.types]]
directive = "test"
title = "Test Case"
prefix = "TEST_"
color = "#DCB239"
style = "node"

# ---------------------------------------------------------------------------
# Statuses
# ---------------------------------------------------------------------------

[[needs.statuses]]
name = "draft"
description = "Draft - Work in progress"

[[needs.statuses]]
name = "open"
description = "Open - Identified but not yet started"

[[needs.statuses]]
name = "approved"
description = "Approved - Ready for implementation"

[[needs.statuses]]
name = "implemented"
description = "Implemented - Code exists"

[[needs.statuses]]
name = "verified"
description = "Verified - Tested and validated"

[[needs.statuses]]
name = "deprecated"
description = "Deprecated - No longer used"

# ---------------------------------------------------------------------------
# Extra Link Types
# ---------------------------------------------------------------------------

# "defines": used on Group Contract Specs to list the DEFINITIONS of their group.
# Agents and Skills link to the Group Contract Spec (not directly to def needs).
[[needs.extra_links]]
option = "defines"
incoming = "is defined by"
outgoing = "defines"

# ===========================================================================
# syspilot-specific sections (ignored by sphinx-needs, read by agents/tooling)
# ===========================================================================

# ---------------------------------------------------------------------------
# Actor Catalogue — maps each Need type to its primary owning actor
# ---------------------------------------------------------------------------

[syspilot.actors]
story     = "System Designer"
req       = "System Designer"
spec      = "System Designer"
def       = "System Designer"
impl      = "Dev Engineer"
test      = "Test Designer"
uat       = "Test Designer"
unit_test = "Dev Engineer"

# ---------------------------------------------------------------------------
# Type Link Relationships — directed, bottom-up relationships between types
# ---------------------------------------------------------------------------

[[syspilot.type_links]]
from = "req"
to   = "story"
rel  = "refines"

[[syspilot.type_links]]
from = "spec"
to   = "req"
rel  = "implements"

[[syspilot.type_links]]
from = "impl"
to   = "spec"
rel  = "implements"

[[syspilot.type_links]]
from = "test"
to   = "req"
rel  = "verifies"

[[syspilot.type_links]]
from = "uat"
to   = "req"
rel  = "validates"

[[syspilot.type_links]]
from = "unit_test"
to   = "spec"
rel  = "verifies"

[[syspilot.type_links]]
from = "def"
to   = "spec"
rel  = "defines"

# ---------------------------------------------------------------------------
# Status Transitions — lifecycle state machine
# ---------------------------------------------------------------------------

[syspilot.status_transitions]
# Universal transitions (apply to all types unless overridden)
universal = [
  { from = "draft",       to = "approved" },
  { from = "draft",       to = "open" },
  { from = "open",        to = "draft" },
  { from = "open",        to = "approved" },
  { from = "approved",    to = "implemented" },
  { from = "implemented", to = "verified" },
  { from = "approved",    to = "draft" },
]

# deprecated is a universal exit — reachable from any status
universal_exit = ["deprecated"]

# Type-specific overrides (replace universal for that type)
[syspilot.status_transitions.overrides.story]
transitions = [
  { from = "draft",    to = "approved" },
  { from = "approved", to = "verified" },
  { from = "approved", to = "draft" },
]

[syspilot.status_transitions.overrides.def]
transitions = [
  { from = "draft",    to = "approved" },
  { from = "approved", to = "draft" },
]
